services:
  vulcanbot:
    image: vulcanbot
    build:
      context: .
      dockerfile: vulcanbot/Dockerfile
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-vulcanbot};Username=${POSTGRES_USER:-vulcanbot};Password=${POSTGRES_PASSWORD:-vulcanbot}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulcanbot}
      POSTGRES_USER: ${POSTGRES_USER:-vulcanbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulcanbot}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

name: Tests

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore vulcanbot.sln

      - name: Build
        run: dotnet build vulcanbot.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test vulcanbot.sln --no-build --configuration Release --verbosity normal
